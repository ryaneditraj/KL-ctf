name: Feature request
description: Suggest a harness improvement that stays inside authorized CTF use.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing when you use KL-ctf today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and how will you know it worked?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Confirm this stays limited to systems the operator is allowed to test.
    validations:
      required: true
